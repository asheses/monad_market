[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

network = "monad"
hardfork = "monad:MonadTen"
solc_version = "0.8.28"
evm_version = "prague"

via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_KEY}", chain = 10143, url = "https://api.etherscan.io/v2/api?chainid=10143" }
monad_mainnet = { key = "${MONAD_EXPLORER_KEY}", chain = 143, url = "https://api.etherscan.io/v2/api?chainid=143" }
